<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สถานะเสี่ยงน้ำท่วม</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f5f7;--card:#fff;--tx:#12171d;--mut:#5a6572;--bd:#d9dee4;--ok:#e6ebf0;--red:#e5484d;--org:#f76b15;--yel:#f5d90a;--acc:#1d4ed8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1217;--card:#171c23;--tx:#eef1f5;--mut:#9aa5b3;--bd:#2a323c;--ok:#222a34;--acc:#7aa7ff;color-scheme:dark}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Noto Sans Thai","Sarabun",sans-serif}
main{max-width:620px;margin:0 auto;padding:14px}
h1{font-size:1.2rem;margin:2px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
#ch{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;font:inherit;font-size:.9rem;padding:7px 12px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#bn{font-weight:700;border-radius:10px;padding:12px;margin-bottom:12px;background:var(--ok)}
#bn.l2{background:var(--org);color:#1a1a1a}#bn.l3{background:var(--red);color:#fff}
#map{height:340px;border-radius:10px;margin-bottom:12px;border:1px solid var(--bd)}
.tt{background:transparent;border:0;box-shadow:none;font-size:12px;font-weight:700;color:#000;text-shadow:0 0 3px #fff;white-space:nowrap;text-align:center}
.lg{display:flex;gap:12px;flex-wrap:wrap;font-size:.82rem;color:var(--mut)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mut{color:var(--mut);font-size:.85rem}
button.b{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button.b{color:#0e1217}}
a{color:var(--acc)}
ul{margin:6px 0 0;padding-left:18px;font-size:.88rem}
code{background:var(--ok);padding:1px 6px;border-radius:5px;font-size:.85rem;word-break:break-all}
</style>
</head>
<body>
<main>
<h1>สถานะเสี่ยงน้ำท่วม</h1>
<div id="ch"></div>
<div id="bn">กำลังโหลด…</div>
<div id="map"></div>
<div class="card"><div class="lg" id="lg"></div><p class="mut" id="zi"></p></div>
<div class="card"><button class="b" onclick="where()">ฉันอยู่โซนไหน</button><p id="me" class="mut">กดเพื่อตรวจว่าตำแหน่งปัจจุบันของคุณอยู่ห่างเซนเซอร์เท่าไร และควรรับแจ้งเตือนช่องไหน</p></div>
<div class="card"><b>เหตุการณ์ล่าสุด</b><ul id="h"></ul><p class="mut">รีเฟรชอัตโนมัติทุก 30 วินาที</p></div>
<details class="card"><summary>ตั้งค่า topic ของแต่ละพื้นที่</summary><div id="setup"></div></details>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ===== รายชื่อพื้นที่ (1 พื้นที่ = 1 เซนเซอร์) =====
const AREAS=[
  {name:'โรงเรียนไชยวานวิทยา',topic:'flood-chaiyawan-7k2x9q',lat:17.2867,lng:103.2233,rn:100,rf:400}
  // ,{name:'พื้นที่ถัดไป',topic:'flood-xxxxx-ชื่อสุ่ม',lat:0,lng:0,rn:100,rf:400}
];
// ==================================================
const $=s=>document.querySelector(s);
const COL=['#7d8b99','#f5d90a','#f76b15','#e5484d'],STALE=45*60;
const TXT={0:'ปกติ ไม่พบน้ำที่เซนเซอร์',2:'🟠 น้ำเริ่มถึงเซนเซอร์ ให้เฝ้าระวัง',3:'🔴 น้ำท่วมที่เซนเซอร์แล้ว'};
const qt=new URLSearchParams(location.search).get('t');
let cur=Math.max(0,AREAS.findIndex(a=>a.topic===qt)),map,lay,fitted=-1,D={};
const tm=t=>new Date(t*1000).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const last=a=>{const E=D[a.topic];return E&&E.length?E[E.length-1]:null};
const old=x=>!x||Date.now()/1000-x.t>STALE;
async function fetchArea(a){
  try{
    const r=await fetch('https://ntfy.sh/'+encodeURIComponent(a.topic)+'-state/json?poll=1&since=12h');
    D[a.topic]=(await r.text()).trim().split('\n').filter(Boolean).map(x=>JSON.parse(x)).filter(e=>e.event==='message').map(e=>({lv:+e.message.split('|')[0]||0,t:e.time}));
  }catch(e){D[a.topic]=null}
}
const lab=(a,r,t)=>L.marker([a.lat+r/111320,a.lng],{icon:L.divIcon({className:'tt',html:t,iconSize:[60,14],iconAnchor:[30,7]}),interactive:false});
function draw(a,lv){
  if(typeof L==='undefined')return;
  if(!map){
    map=L.map('map');
    const o=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    const s=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri'});
    L.control.layers({'แผนที่':o,'ดาวเทียม':s}).addTo(map);lay=L.layerGroup().addTo(map);
  }
  lay.clearLayers();
  const g={color:COL[0],weight:1,dashArray:'4',fillOpacity:.05},f=(c,o)=>({color:c,weight:2,fillColor:c,fillOpacity:o});
  const far=L.circle([a.lat,a.lng],{radius:a.rf,...(lv==3?f(COL[1],.28):g)}).addTo(lay);
  L.circle([a.lat,a.lng],{radius:a.rn,...(lv==3?f(COL[2],.42):lv==2?f(COL[1],.4):g)}).addTo(lay);
  L.circleMarker([a.lat,a.lng],{radius:9,color:'#fff',weight:2,fillColor:COL[lv],fillOpacity:1}).bindTooltip('เซนเซอร์').addTo(lay);
  lab(a,a.rn,a.rn+' ม.').addTo(lay);lab(a,a.rf,a.rf+' ม.').addTo(lay);
  if(fitted!==cur){fitted=cur;map.fitBounds(far.getBounds());setTimeout(()=>map.invalidateSize(),50)}
}
function render(){
  const a=AREAS[cur],E=D[a.topic],x=last(a),lv=x?x.lv:0;
  $('#ch').innerHTML=AREAS.map((z,i)=>'<button class="chip'+(i==cur?' on':'')+'" onclick="go('+i+')"><i style="background:'+COL[(last(z)||{lv:0}).lv]+'"></i>'+z.name+'</button>').join('');
  $('#bn').className='l'+lv;
  $('#bn').textContent=a.name+' — '+(E===null?'เชื่อมต่อ ntfy ไม่ได้':!x?'ยังไม่พบรายงานจากเซนเซอร์ ตรวจสอบว่าเปิดเครื่องและตั้ง topic ถูกต้อง':TXT[lv]+' · อัปเดต '+tm(x.t)+(old(x)?' ⚠ เซนเซอร์เงียบเกิน 45 นาที ควรไปตรวจ':''));
  draw(a,lv);
  $('#lg').innerHTML='<span><i style="background:var(--red)"></i>แดง = จุดเซนเซอร์ท่วมแล้ว</span><span><i style="background:var(--org)"></i>ส้ม = 0-'+a.rn+' ม. น้ำกำลังจะท่วม</span><span><i style="background:var(--yel)"></i>เหลือง = '+a.rn+'-'+a.rf+' ม. ให้ระวัง</span>';
  $('#zi').textContent=lv==3?'ตอนนี้: ภายใน '+a.rn+' ม. น้ำกำลังจะท่วม · ระยะ '+a.rn+'-'+a.rf+' ม. โปรดระวัง':lv==2?'ตอนนี้: ภายใน '+a.rn+' ม. เฝ้าระวัง · ระยะ '+a.rn+'-'+a.rf+' ม. ติดตามสถานการณ์':'ตอนนี้ยังไม่มีการเตือน';
  const ch=(E||[]).filter((e,i,r)=>i==0||r[i-1].lv!=e.lv).slice(-6).reverse();
  $('#h').innerHTML=ch.map(e=>'<li>'+tm(e.t)+' — '+TXT[e.lv]+'</li>').join('')||'<li class="mut">ยังไม่มีเหตุการณ์</li>';
}
function go(i){cur=i;$('#me').textContent='กดเพื่อตรวจว่าตำแหน่งปัจจุบันของคุณอยู่ห่างเซนเซอร์เท่าไร และควรรับแจ้งเตือนช่องไหน';render()}
function where(){
  const a=AREAS[cur];
  if(!navigator.geolocation){$('#me').textContent='เบราว์เซอร์นี้ไม่รองรับการระบุตำแหน่ง';return}
  navigator.geolocation.getCurrentPosition(p=>{
    const R=6371000,r=Math.PI/180,dl=(p.coords.latitude-a.lat)*r,dg=(p.coords.longitude-a.lng)*r;
    const h=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(p.coords.latitude*r)*Math.sin(dg/2)**2,d=Math.round(2*R*Math.asin(Math.sqrt(h)));
    $('#me').innerHTML='คุณอยู่ห่างเซนเซอร์ประมาณ <b>'+d+' ม.</b> — '+(d<=a.rn?'อยู่โซนส้ม ควร subscribe <code>'+a.topic+'-near</code>':d<=a.rf?'อยู่โซนเหลือง ควร subscribe <code>'+a.topic+'-far</code>':'อยู่นอกรัศมี '+a.rf+' ม. ไม่อยู่ในพื้นที่เฝ้าระวัง');
    if(map)L.circleMarker([p.coords.latitude,p.coords.longitude],{radius:7,color:'#fff',weight:2,fillColor:'#1d4ed8',fillOpacity:1}).bindTooltip('คุณอยู่ที่นี่').addTo(lay);
  },()=>{$('#me').textContent='ขอตำแหน่งไม่ได้ ตรวจสอบว่าอนุญาตการเข้าถึงตำแหน่งแล้ว'});
}
$('#setup').innerHTML=AREAS.map(a=>'<p><b>'+a.name+'</b><br>ใส่ <code>TOPIC = "'+a.topic+'"</code> ในโค้ด ESP32<br>โทรศัพท์ในแอป ntfy: อยู่ภายใน '+a.rn+' ม. subscribe <code>'+a.topic+'-near</code> · อยู่ '+a.rn+'-'+a.rf+' ม. subscribe <code>'+a.topic+'-far</code></p>').join('');
async function refresh(){await Promise.all(AREAS.map(fetchArea));render()}
refresh();setInterval(refresh,30000);
</script>
</body>
</html>
